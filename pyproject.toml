[project]
name = "id-tokenizer"
version = "0.1.0"
description = "Encode UUIDs and integers as memorable word sequences"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["uuid", "encoding", "mnemonic", "tokenizer", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project.scripts]
id-tokenizer = "id_tokenizer._cli:main"

[tool.maturin]
features = ["python"]
module-name = "id_tokenizer"
python-source = "python"

[dependency-groups]
dev = ["pytest", "maturin"]
